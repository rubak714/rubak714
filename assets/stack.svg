<svg viewBox="0 0 720 448" xmlns="http://www.w3.org/2000/svg" width="720">
  <defs>
    <style>
      .t   { font-family:'Courier New',Courier,monospace; }
      .lbl { font-size:12px; fill:#58a6ff; font-weight:700; }
      .val { font-size:11px; fill:#8b949e; }
      .hdr { font-size:10.5px; fill:#30363d; font-weight:700; letter-spacing:0.1em; }
      .box { fill:#161b22; stroke:#21262d; stroke-width:1; }
      .pct { font-size:11px; fill:#58a6ff; font-weight:700; }
      .bar-bg { fill:#21262d; }
      .bar-fg { fill:#1f6feb; }
      .bar-fg7 { fill:#388bfd; }
      .num { font-size:13px; fill:#30363d; font-weight:700; }

      /* odd rows slide from LEFT */
      .from-left  { opacity:0; animation: slideL 0.45s ease-out forwards; }
      /* even rows slide from RIGHT */
      .from-right { opacity:0; animation: slideR 0.45s ease-out forwards; }

      .d1 { animation-delay: 0.1s; }
      .d2 { animation-delay: 0.6s; }
      .d3 { animation-delay: 1.1s; }
      .d4 { animation-delay: 1.6s; }
      .d5 { animation-delay: 2.1s; }
      .d6 { animation-delay: 2.6s; }
      .d7 { animation-delay: 3.1s; }

      @keyframes slideL {
        from { opacity:0; transform:translateX(-28px); }
        to   { opacity:1; transform:translateX(0); }
      }
      @keyframes slideR {
        from { opacity:0; transform:translateX(28px); }
        to   { opacity:1; transform:translateX(0); }
      }
    </style>
  </defs>

  <rect width="720" height="448" rx="8" fill="#0d1117"/>

  <!-- title -->
  <text x="360" y="28" text-anchor="middle" font-family="'Courier New',monospace"
        font-size="12.5" fill="#58a6ff" font-weight="700" letter-spacing="0.14em">HOW I WORK ACROSS THE STACK</text>
  <line x1="30" y1="36" x2="690" y2="36" stroke="#21262d" stroke-width="0.8"/>

  <!-- headers -->
  <text x="52"  y="52" class="hdr">LAYER</text>
  <text x="190" y="52" class="hdr">DOMAIN</text>
  <text x="390" y="52" class="hdr">KEY TOOLS</text>
  <text x="665" y="52" class="hdr" text-anchor="end">DEPTH</text>

  <!-- row height 54, y start 58 -->

  <!-- L1 FROM LEFT -->
  <g class="from-left d1">
    <rect x="18" y="57" width="684" height="50" rx="5" class="box"/>
    <text x="46"  y="75"  class="num">01</text>
    <text x="46"  y="97"  class="lbl">Identity and Access</text>
    <text x="190" y="75"  class="val">Active Directory, Entra ID</text>
    <text x="190" y="91"  class="val">GPO, RBAC, SSO, MFA, PIM, LDAP</text>
    <text x="390" y="75"  class="val">AD DS, Azure AD Connect</text>
    <text x="390" y="91"  class="val">Conditional Access, Domain Controllers</text>
    <rect x="620" y="68"  width="68" height="5" rx="2" class="bar-bg"/>
    <rect x="620" y="68"  width="65" height="5" rx="2" class="bar-fg"/>
    <text x="654" y="90"  class="pct" text-anchor="middle">95%</text>
  </g>

  <!-- L2 FROM RIGHT -->
  <g class="from-right d2">
    <rect x="18" y="112" width="684" height="50" rx="5" class="box"/>
    <text x="46"  y="130" class="num">02</text>
    <text x="46"  y="152" class="lbl">Systems and On-Premise</text>
    <text x="190" y="130" class="val">Linux: Ubuntu, RHEL, Debian</text>
    <text x="190" y="146" class="val">Windows Server 2019/2022, Hyper-V</text>
    <text x="390" y="130" class="val">systemd, cron, IIS, Bash, PowerShell</text>
    <text x="390" y="146" class="val">patch management, SCCM, VMware</text>
    <rect x="620" y="123" width="68" height="5" rx="2" class="bar-bg"/>
    <rect x="620" y="123" width="61" height="5" rx="2" class="bar-fg"/>
    <text x="654" y="145" class="pct" text-anchor="middle">90%</text>
  </g>

  <!-- L3 FROM LEFT -->
  <g class="from-left d3">
    <rect x="18" y="167" width="684" height="50" rx="5" class="box"/>
    <text x="46"  y="185" class="num">03</text>
    <text x="46"  y="207" class="lbl">Networking</text>
    <text x="190" y="185" class="val">DNS, DHCP, VPN, Firewalls, Cisco IOS</text>
    <text x="190" y="201" class="val">TCP/IP, Subnetting, VLANs</text>
    <text x="390" y="185" class="val">BGP/OSPF basics, pfSense, NSG</text>
    <text x="390" y="201" class="val">Wireshark, network monitoring</text>
    <rect x="620" y="178" width="68" height="5" rx="2" class="bar-bg"/>
    <rect x="620" y="178" width="60" height="5" rx="2" class="bar-fg"/>
    <text x="654" y="200" class="pct" text-anchor="middle">88%</text>
  </g>

  <!-- L4 FROM RIGHT -->
  <g class="from-right d4">
    <rect x="18" y="222" width="684" height="50" rx="5" class="box"/>
    <text x="46"  y="240" class="num">04</text>
    <text x="46"  y="262" class="lbl">Microsoft 365 and Endpoint</text>
    <text x="190" y="240" class="val">Exchange Online, Teams, SharePoint</text>
    <text x="190" y="256" class="val">Intune MDM/MAM, OneDrive</text>
    <text x="390" y="240" class="val">Defender for Endpoint, SCCM</text>
    <text x="390" y="256" class="val">compliance policies, licence management</text>
    <rect x="620" y="233" width="68" height="5" rx="2" class="bar-bg"/>
    <rect x="620" y="233" width="58" height="5" rx="2" class="bar-fg"/>
    <text x="654" y="255" class="pct" text-anchor="middle">85%</text>
  </g>

  <!-- L5 FROM LEFT -->
  <g class="from-left d5">
    <rect x="18" y="277" width="684" height="50" rx="5" class="box"/>
    <text x="46"  y="295" class="num">05</text>
    <text x="46"  y="317" class="lbl">Security and SOC</text>
    <text x="190" y="295" class="val">SIEM: Splunk, Elastic, MS Sentinel</text>
    <text x="190" y="311" class="val">log analysis, alert triage</text>
    <text x="390" y="295" class="val">vulnerability management, IAM auditing</text>
    <text x="390" y="311" class="val">incident response, firewall hardening</text>
    <rect x="620" y="288" width="68" height="5" rx="2" class="bar-bg"/>
    <rect x="620" y="288" width="56" height="5" rx="2" class="bar-fg"/>
    <text x="654" y="310" class="pct" text-anchor="middle">82%</text>
  </g>

  <!-- L6 FROM RIGHT -->
  <g class="from-right d6">
    <rect x="18" y="332" width="684" height="50" rx="5" class="box"/>
    <text x="46"  y="350" class="num">06</text>
    <text x="46"  y="372" class="lbl">Cloud and Hybrid Infrastructure</text>
    <text x="190" y="350" class="val">Azure, AWS, GCP</text>
    <text x="190" y="366" class="val">Terraform, Ansible, Vagrant</text>
    <text x="390" y="350" class="val">AKS, Azure Monitor, Log Analytics</text>
    <text x="390" y="366" class="val">GKE, EC2, VPC, Cloud IAM</text>
    <rect x="620" y="343" width="68" height="5" rx="2" class="bar-bg"/>
    <rect x="620" y="343" width="60" height="5" rx="2" class="bar-fg"/>
    <text x="654" y="365" class="pct" text-anchor="middle">88%</text>
  </g>

  <!-- L7 FROM LEFT highlighted -->
  <g class="from-left d7">
    <rect x="18" y="387" width="684" height="50" rx="5" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="46"  y="405" class="num" fill="#388bfd">07</text>
    <text x="46"  y="427" font-family="'Courier New',monospace" font-size="12px" fill="#79c0ff" font-weight="700">Automation, DevOps and Observability</text>
    <text x="190" y="405" class="val">Docker, Kubernetes, Helm, ArgoCD</text>
    <text x="190" y="421" class="val">GitHub Actions, Jenkins, GitLab CI</text>
    <text x="390" y="405" class="val">Grafana, Prometheus, ELK, Datadog</text>
    <text x="390" y="421" class="val">HPA, ServiceMonitor, CI/CD pipelines</text>
    <rect x="620" y="398" width="68" height="5" rx="2" class="bar-bg"/>
    <rect x="620" y="398" width="58" height="5" rx="2" class="bar-fg7"/>
    <text x="654" y="420" font-family="'Courier New',monospace" font-size="11px" fill="#79c0ff" font-weight="700" text-anchor="middle">85%</text>
  </g>
</svg>
