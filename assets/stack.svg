<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580">
  <foreignObject width="800" height="580">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        .wrap {
          background: #0d1117;
          font-family: 'Courier New', monospace;
          padding: 14px 16px 18px 16px;
          width: 800px;
          border-radius: 8px;
        }
        .title {
          text-align: center;
          color: #58a6ff;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.15em;
          margin-bottom: 10px;
          padding-bottom: 8px;
          border-bottom: 1px solid #21262d;
        }
        .row {
          display: flex;
          gap: 8px;
          margin-bottom: 6px;
          opacity: 0;
          animation: fadein 0.6s ease forwards;
        }
        .row:nth-child(2) { animation-delay: 0.1s; }
        .row:nth-child(3) { animation-delay: 0.5s; }
        .row:nth-child(4) { animation-delay: 0.9s; }
        .row:nth-child(5) { animation-delay: 1.3s; }
        .row:nth-child(6) { animation-delay: 1.7s; }
        .row:nth-child(7) { animation-delay: 2.1s; }
        .row:nth-child(8) { animation-delay: 2.5s; }
        @keyframes fadein {
          from { opacity: 0; }
          to   { opacity: 1; }
        }
        .num {
          background: #161b22;
          border: 1px solid #21262d;
          border-radius: 6px;
          font-size: 16px;
          font-weight: 700;
          width: 40px;
          min-width: 40px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .card {
          background: #161b22;
          border: 1px solid #21262d;
          border-radius: 6px;
          padding: 7px 11px;
          flex: 1;
        }
        .card.c7 { border-color: #1f6feb; }
        .card-top {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 3px;
        }
        .lname { font-size: 11px; font-weight: 700; }
        .c1 { color: #79c0ff; }
        .c2 { color: #56d364; }
        .c3 { color: #e3b341; }
        .c4 { color: #f78166; }
        .c5 { color: #d2a8ff; }
        .c6 { color: #39d353; }
        .c7 { color: #388bfd; }
        .n1 { color: #79c0ff; }
        .n2 { color: #56d364; }
        .n3 { color: #e3b341; }
        .n4 { color: #f78166; }
        .n5 { color: #d2a8ff; }
        .n6 { color: #39d353; }
        .n7 { color: #388bfd; }
        .pct { font-size: 10px; font-weight: 700; color: #8b949e; }
        .bar-track {
          height: 3px;
          background: #21262d;
          border-radius: 2px;
          margin-bottom: 4px;
          overflow: hidden;
        }
        .bar-fill {
          height: 3px;
          border-radius: 2px;
          animation: growbar 1s ease forwards;
          width: 0%;
        }
        .b1 { background: #79c0ff; width: 95%; }
        .b2 { background: #56d364; width: 90%; }
        .b3 { background: #e3b341; width: 88%; }
        .b4 { background: #f78166; width: 85%; }
        .b5 { background: #d2a8ff; width: 82%; }
        .b6 { background: #39d353; width: 88%; }
        .b7 { background: #388bfd; width: 85%; }
        @keyframes growbar {
          from { width: 0%; }
        }
        .tools {
          font-size: 10px;
          color: #6e7681;
          line-height: 1.5;
        }
        .tools span { color: #8b949e; }
      </style>
      <div class="wrap">
        <div class="title">HOW I WORK ACROSS THE STACK</div>

        <div class="row">
          <div class="num n1">01</div>
          <div class="card">
            <div class="card-top">
              <span class="lname c1">Identity and Access Management</span>
              <span class="pct">95%</span>
            </div>
            <div class="bar-track"><div class="bar-fill b1"></div></div>
            <div class="tools"><span>Active Directory, Entra ID, GPO, RBAC, SSO, MFA, PIM, LDAP, Azure AD Connect, Domain Controllers</span></div>
          </div>
        </div>

        <div class="row">
          <div class="num n2">02</div>
          <div class="card">
            <div class="card-top">
              <span class="lname c2">Systems and On-Premise Infrastructure</span>
              <span class="pct">90%</span>
            </div>
            <div class="bar-track"><div class="bar-fill b2"></div></div>
            <div class="tools"><span>Linux: Ubuntu, RHEL, Debian - Windows Server 2019/2022 - Hyper-V, VMware, IIS, systemd, cron, SCCM, Bash, PowerShell</span></div>
          </div>
        </div>

        <div class="row">
          <div class="num n3">03</div>
          <div class="card">
            <div class="card-top">
              <span class="lname c3">Networking</span>
              <span class="pct">88%</span>
            </div>
            <div class="bar-track"><div class="bar-fill b3"></div></div>
            <div class="tools"><span>DNS, DHCP, VPN (OpenVPN, IPSec, WireGuard), Firewalls, Cisco IOS, TCP/IP, Subnetting, VLANs, BGP/OSPF basics, Wireshark</span></div>
          </div>
        </div>

        <div class="row">
          <div class="num n4">04</div>
          <div class="card">
            <div class="card-top">
              <span class="lname c4">Microsoft 365 and Endpoint Management</span>
              <span class="pct">85%</span>
            </div>
            <div class="bar-track"><div class="bar-fill b4"></div></div>
            <div class="tools"><span>Exchange Online, Teams, SharePoint, OneDrive, Intune MDM/MAM, Defender for Endpoint, SCCM, compliance and retention policies</span></div>
          </div>
        </div>

        <div class="row">
          <div class="num n5">05</div>
          <div class="card">
            <div class="card-top">
              <span class="lname c5">Security and SOC</span>
              <span class="pct">82%</span>
            </div>
            <div class="bar-track"><div class="bar-fill b5"></div></div>
            <div class="tools"><span>SIEM: Splunk, Elastic SIEM, Microsoft Sentinel - log analysis, alert triage, vulnerability management, IAM auditing, incident response</span></div>
          </div>
        </div>

        <div class="row">
          <div class="num n6">06</div>
          <div class="card">
            <div class="card-top">
              <span class="lname c6">Cloud and Hybrid Infrastructure</span>
              <span class="pct">88%</span>
            </div>
            <div class="bar-track"><div class="bar-fill b6"></div></div>
            <div class="tools"><span>Azure, AWS, GCP - Terraform, Ansible, Vagrant - AKS, Azure Monitor, Log Analytics, GKE, EC2, VPC, Cloud IAM</span></div>
          </div>
        </div>

        <div class="row">
          <div class="num n7">07</div>
          <div class="card c7">
            <div class="card-top">
              <span class="lname c7">Automation, DevOps and Observability</span>
              <span class="pct">85%</span>
            </div>
            <div class="bar-track"><div class="bar-fill b7"></div></div>
            <div class="tools"><span>Docker, Kubernetes, Helm, ArgoCD - GitHub Actions, Jenkins, GitLab CI - Grafana, Prometheus, ELK Stack, Datadog, Zabbix, HPA, ServiceMonitor</span></div>
          </div>
        </div>

      </div>
    </div>
  </foreignObject>
</svg>
