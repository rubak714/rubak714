      .r2{animation:fi .22s .38s both;} .r3{animation:fi .22s .56s both;}
      .r4{animation:fi .22s .74s both;} .r5{animation:fi .22s .92s both;}
      .r6{animation:fi .22s 1.10s both;} .r7{animation:fi .22s 1.28s both;}
      .r8{animation:fi .22s 1.46s both;}
      @keyframes fi{from{opacity:0}to{opacity:1}}
    </style>
