  <rect width="740" height="420" rx="10" class="win"/>
  <rect width="740" height="34" rx="10" class="bar"/>
  <rect y="17" width="740" height="17" class="bar"/>
  <circle cx="22" cy="17" r="6" fill="#f78166"/>
  <circle cx="44" cy="17" r="6" fill="#e3b341"/>
  <circle cx="66" cy="17" r="6" fill="#3fb950"/>
  <text x="370" y="22" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#484f58">rubak714@enterprise-stack -- bash -- 96x32</text>

  <!-- CMD 1: whoami -->
  <g class="l01">
    <text x="18" y="58" class="t">
      <tspan class="blu">rubak714@enterprise-stack</tspan><tspan class="dim">:</tspan><tspan class="nvy">~</tspan><tspan class="dim"> $ </tspan><tspan class="wht">whoami --full</tspan>
    </text>
  </g>
  <g class="l02"><text x="18" y="75"  class="t"><tspan class="dim">  name       : </tspan><tspan class="grn">Rubaiya -- M.Sc. Communications, Systems and Networks -- Cologne, DE</tspan></text></g>
  <g class="l03"><text x="18" y="91"  class="t"><tspan class="dim">  experience : </tspan><tspan class="grn">3+ years across IT infrastructure, cloud and security in Germany</tspan></text></g>
  <g class="l04"><text x="18" y="107" class="t"><tspan class="dim">  notice     : </tspan><tspan class="yel">2 weeks</tspan><tspan class="dim">    relocation : </tspan><tspan class="yel">possible within Germany</tspan></text></g>

  <!-- CMD 2: stack -->
  <g class="l05">
    <text x="18" y="131" class="t">
      <tspan class="blu">rubak714@enterprise-stack</tspan><tspan class="dim">:</tspan><tspan class="nvy">~</tspan><tspan class="dim"> $ </tspan><tspan class="wht">systemctl list-units --type=skill --state=active</tspan>
    </text>
  </g>
  <g class="l06"><text x="18" y="148" class="t dim">  LAYER                         STACK                                           STATUS</text></g>
  <g class="l07"><text x="18" y="164" class="t"><tspan class="grn">  @ </tspan><tspan class="nvy">identity.service          </tspan><tspan class="dim">AD, Entra ID, GPO, RBAC, SSO, MFA              </tspan><tspan class="grn">active</tspan></text></g>
  <g class="l08"><text x="18" y="180" class="t"><tspan class="grn">  @ </tspan><tspan class="nvy">systems.service           </tspan><tspan class="dim">Linux, Windows Server, Bash, PowerShell         </tspan><tspan class="grn">active</tspan></text></g>
  <g class="l09"><text x="18" y="196" class="t"><tspan class="grn">  @ </tspan><tspan class="nvy">networking.service        </tspan><tspan class="dim">DNS, DHCP, VPN, Firewall, Cisco, TCP/IP         </tspan><tspan class="grn">active</tspan></text></g>
  <g class="l10"><text x="18" y="212" class="t"><tspan class="grn">  @ </tspan><tspan class="nvy">microsoft365.service      </tspan><tspan class="dim">Exchange, Teams, SharePoint, Intune, Defender   </tspan><tspan class="grn">active</tspan></text></g>
  <g class="l11"><text x="18" y="228" class="t"><tspan class="grn">  @ </tspan><tspan class="nvy">security-soc.service      </tspan><tspan class="dim">Splunk, ELK, Sentinel, log analysis, triage     </tspan><tspan class="grn">active</tspan></text></g>
  <g class="l12"><text x="18" y="244" class="t"><tspan class="grn">  @ </tspan><tspan class="nvy">cloud.service             </tspan><tspan class="dim">Azure, AWS, GCP, Terraform, Ansible              </tspan><tspan class="grn">active</tspan></text></g>
  <g class="l13"><text x="18" y="260" class="t"><tspan class="grn">  @ </tspan><tspan class="nvy">automation.service        </tspan><tspan class="dim">Docker, K8s, Helm, Grafana, Prometheus, CI/CD   </tspan><tspan class="grn">active</tspan></text></g>

  <!-- CMD 3: availability -->
  <g class="l14">
    <text x="18" y="284" class="t">
      <tspan class="blu">rubak714@enterprise-stack</tspan><tspan class="dim">:</tspan><tspan class="nvy">~</tspan><tspan class="dim"> $ </tspan><tspan class="wht">curl -s https://linkedin.com/in/rubkp110 | grep availability</tspan>
    </text>
  </g>
  <g class="l15"><text x="18" y="301" class="t"><tspan class="dim">  open_to     : </tspan><tspan class="grn">Azure Admin, Cloud Admin, IT Admin, IT Support, SysAdmin, SOC</tspan></text></g>
  <g class="l16"><text x="18" y="317" class="t"><tspan class="dim">  long_term   : </tspan><tspan class="grn">growing into DevOps and SRE engineering</tspan></text></g>

  <!-- final prompt -->
  <g>
    <text x="18" y="350" class="t" style="opacity:0;animation:f .05s 6.0s forwards">
      <tspan class="blu">rubak714@enterprise-stack</tspan><tspan class="dim">:</tspan><tspan class="nvy">~</tspan><tspan class="dim"> $ </tspan>
    </text>
    <rect x="230" y="338" width="8" height="14" class="cur" style="opacity:0;animation:f .05s 6.0s forwards, blink 1s 6.0s step-end infinite"/>
  </g>
</svg>
