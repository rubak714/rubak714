<svg width="720" height="370" viewBox="0 0 720 370" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1520"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111c2a"/>
      <stop offset="100%" stop-color="#0e1826"/>
    </linearGradient>
    <!-- same diagonal stripe as stack -->
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="transparent"/>
      <rect width="1" height="10" fill="#1a2535" opacity="0.5"/>
    </pattern>
    <style>
      .m { font-family: 'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace; }
      .a0  { animation: fi .3s .05s  both; }
      .a1  { animation: fi .3s .30s  both; }
      .a2  { animation: fi .3s .55s  both; }
      .a3  { animation: fi .3s .75s  both; }
      .a4  { animation: fi .3s .95s  both; }
      .a5  { animation: fi .3s 1.15s both; }
      .a6  { animation: fi .3s 1.35s both; }
      .a7  { animation: fi .3s 1.60s both; }
      .a8  { animation: fi .3s 1.80s both; }
      .a9  { animation: fi .3s 2.00s both; }
      .a10 { animation: fi .3s 2.20s both; }
      .a11 { animation: fi .3s 2.40s both; }
      .a12 { animation: fi .3s 2.65s both; }
      .a13 { animation: fi .3s 2.85s both; }
      .a14 { animation: fi .3s 3.05s both; }
      .cur { animation: fi .3s 3.25s both, bl 1.1s 3.55s step-end infinite; }
      @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
      @keyframes bl { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- body: same deep nordic navy as stack -->
  <rect width="720" height="370" rx="10" fill="url(#tbg)"/>
  <!-- stripe texture on top band only -->
  <rect width="720" height="50" rx="10" fill="url(#stripes)" opacity="0.8"/>
  <rect y="38" width="720" height="12" fill="url(#tbg)"/>
  <rect width="720" height="370" rx="10" fill="none" stroke="#1a2535" stroke-width="1.2"/>

  <!-- topbar -->
  <rect width="720" height="42" rx="10" fill="url(#tbar)"/>
  <rect y="30" width="720" height="12" fill="#111c2a"/>
  <rect y="41" width="720" height="2" fill="#4a90d4" opacity="0.5"/>

  <!-- traffic dots -->
